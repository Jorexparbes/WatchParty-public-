<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e13">
<title>Watch Party</title>
<link rel="preconnect" href="https://www.gstatic.com">
<style>
:root{--bg:#0e0e13;--sf:#17171f;--sf2:#1f1f29;--bd:rgba(255,255,255,.08);--fg:#f2f2f5;--mu:#8b8b99;--ac:#ff6a3d;--ac2:#ff3d7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri","Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
input{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;outline:none;min-width:0}
input:focus{border-color:var(--ac)}
button{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;font-weight:600;width:100%;padding:13px}
#home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.hc{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub,.mut{color:var(--mu);font-size:14px;margin:0}
.or{text-align:center;color:var(--mu);font-size:12px}
.row{display:flex;gap:8px}.er{color:#ff7b7b;font-size:13px;margin:0;min-height:1em}
#room{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
.hr{display:flex;gap:8px;align-items:center}
.tag{font-size:12px;background:rgba(255,106,61,.15);color:#ffb199;padding:4px 10px;border-radius:99px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.L{flex:none}
.C{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.stage video,#ytw,#ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#empty,#need{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--mu);font-size:14px;padding:12px;background:#000}
.ppl{display:flex;gap:12px;padding:14px 12px 8px;overflow-x:auto}
.pe{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);min-width:48px}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;position:relative;border:2px solid transparent;transition:box-shadow .15s}
.pe.sp .av{border-color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.cr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px}
.mc{position:absolute;right:-5px;bottom:-3px;font-style:normal;font-size:10px;background:var(--bg);border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.bar{display:flex;gap:8px;padding:0 12px 8px;align-items:center}
#mic.on{background:var(--ac);border-color:transparent}
.rx{display:flex;gap:4px;flex:1;justify-content:flex-end}.rx button{padding:8px 10px;font-size:18px;line-height:1}
.src{display:flex;gap:6px;padding:0 12px 8px}.src input{padding:9px 12px}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px}
.w{display:flex;flex-direction:column;max-width:82%;align-items:flex-start}.w.me{align-self:flex-end;align-items:flex-end}
.nm{font-size:10px;color:var(--mu);opacity:.75;margin:0 6px 2px}
.b{padding:8px 12px;border-radius:16px;background:var(--sf2);font-size:14px;line-height:1.4;word-break:break-word;border-bottom-left-radius:4px}
.me .b{background:linear-gradient(135deg,var(--ac),var(--ac2));border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;padding-top:8px}
.fl{position:absolute;bottom:24px;display:flex;flex-direction:column;align-items:center;animation:up 2.3s ease-out forwards;pointer-events:none}
.fl small{font-size:10px;color:#fff;opacity:.7}.fl b{font-size:28px;font-weight:400}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.8);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:900px){.main{flex-direction:row;gap:16px;padding:0 16px 16px}.L{flex:1;min-width:0;overflow-y:auto}.C{width:360px;flex:none;background:var(--sf);border-radius:20px;padding:12px}.stage{border-radius:16px}}
</style></head><body>

<div id="home"><div class="hc">
  <div class="logo">🎬 Watch Party</div>
  <p class="sub">বন্ধুদের সাথে একসাথে ভিডিও দেখুন, কথা বলুন, চ্যাট করুন</p>
  <input id="name" placeholder="আপনার নাম" maxlength="20">
  <button class="pri" id="mk">নতুন রুম খুলুন</button>
  <div class="or">অথবা বন্ধুর কোড দিয়ে ঢুকুন</div>
  <div class="row"><input id="code" placeholder="রুম কোড" maxlength="8"><button id="jn">ঢুকুন</button></div>
  <p class="er" id="er"></p>
</div></div>

<div id="room" hidden>
  <header>
    <div><b>🎬 <span id="rc"></span></b> <span class="mut" id="cnt"></span></div>
    <div class="hr"><span class="tag" id="role"></span><button id="share">🔗 শেয়ার</button></div>
  </header>
  <div class="main">
    <section class="L">
      <div class="stage" id="stage">
        <div id="ytw" hidden><div id="yt"></div></div>
        <video id="v" controls playsinline hidden></video>
        <div id="empty">ভিডিও এখনো দেওয়া হয়নি</div>
        <div id="need" hidden><span>এই ভিডিওটা আপনার ফোন থেকে বেছে নিন:<br><b id="needt"></b></span><button id="pk">ফাইল বেছে নিন</button></div>
      </div>
      <div class="ppl" id="ppl"></div>
      <div class="bar"><button id="mic">🎙 মাইক বন্ধ</button><div class="rx" id="rx"></div></div>
      <div class="src" id="src" hidden>
        <input id="su" placeholder="YouTube বা ভিডিও লিংক"><button id="go">লোড</button><button id="pf" aria-label="ফাইল">📁</button><button id="opn"></button>
      </div>
      <input type="file" id="fi" accept="video/*" hidden>
    </section>
    <section class="C">
      <div id="chat"></div>
      <div class="send"><input id="mi" placeholder="মেসেজ লিখুন…" maxlength="500"><button id="sd" aria-label="পাঠান">➤</button></div>
    </section>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,set,update,push,remove,get,onValue,onChildAdded,onDisconnect,serverTimestamp,query,limitToLast}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== এখানে আপনার Firebase কনফিগ বসান ====== */
const CFG={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:"YOUR_PROJECT",
  appId:"YOUR_APP_ID"
};
/* ভয়েস কানেকশন না হলে এখানে TURN সার্ভার যোগ করুন */
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}];
/* ================================================ */

const $=id=>document.getElementById(id);
const app=initializeApp(CFG),auth=getAuth(app),db=getDatabase(app);
let uid,code,name,hostUid=null,openCtl=false,U={},off=0,S=null,curKey="",mode="",yt=null,ignore=false,lastT=0,lastTs=Date.now();
let localFile=null,localName="",micOn=false,micTrack=null,ac=null,chain=Promise.resolve();
const peers={},lv={};
const R=p=>ref(db,"rooms/"+code+(p?"/"+p:""));
const now=()=>Date.now()+off;
const canCtl=()=>uid===hostUid||openCtl;
const V=$("v");

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
const col=id=>"hsl("+([...id].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360)+" 55% 42%)";

/* ---------- ঢোকা ---------- */
const q=new URLSearchParams(location.search).get("r");
$("name").value=localStorage.getItem("wp_name")||"";
if(q)$("code").value=q;
$("mk").onclick=()=>go(true);
$("jn").onclick=()=>go(false);
function err(t){$("er").textContent=t}
async function go(create){
  name=$("name").value.trim().slice(0,20);
  if(!name)return err("আপনার নাম লিখুন");
  const c=create?Array.from({length:5},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join(""):$("code").value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!c)return err("রুম কোড দিন");
  err("");localStorage.setItem("wp_name",name);
  try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(_){}
  try{
    uid=(auth.currentUser||(await signInAnonymously(auth)).user).uid;code=c;
    if(create){await set(R("host"),uid)}
    else if(!(await get(R("host"))).exists())throw"nf";
    const us=(await get(R("users"))).val()||{};
    if(!us[uid]&&Object.keys(us).length>=5)throw"full";
    await onDisconnect(R("users/"+uid)).remove();
    await set(R("users/"+uid),{name,mic:false,j:serverTimestamp()});
    history.replaceState(null,"","?r="+code);
    start();
  }catch(e){err(e==="nf"?"এই কোডে কোনো রুম নেই":e==="full"?"রুম ভর্তি (সর্বোচ্চ ৫ জন)":"ঢোকা যায়নি, আবার চেষ্টা করুন")}
}
function start(){
  $("home").hidden=true;$("room").hidden=false;$("rc").textContent=code;
  onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
  onValue(R("host"),s=>{hostUid=s.val();ui()});
  onValue(R("open"),s=>{openCtl=s.val()===true;ui()});
  onValue(R("users"),s=>{U=s.val()||{};people();syncPeers()});
  onValue(R("video"),s=>applyState(s.val()));
  onChildAdded(query(R("chat"),limitToLast(60)),s=>onMsg(s.val()));
  remove(R("rtc/"+uid)).catch(()=>{}).finally(()=>onChildAdded(R("rtc/"+uid),s=>{const m=s.val();remove(s.ref);chain=chain.then(()=>onSig(m)).catch(()=>{})}));
  setInterval(poll,500);setInterval(level,200);
}

/* ---------- UI ---------- */
function ui(){
  const c=canCtl();$("src").hidden=!c;$("opn").hidden=uid!==hostUid;
  $("opn").textContent=openCtl?"🔓 সবার কন্ট্রোল":"🔒 শুধু হোস্ট";
  $("role").textContent=uid===hostUid?"👑 আপনি হোস্ট":(openCtl?"সবাই কন্ট্রোল করছে":"দর্শক");
  people();
}
function people(){
  const box=$("ppl");box.textContent="";const ids=Object.keys(U);$("cnt").textContent=ids.length+"/5 জন";
  ids.forEach(id=>{
    const u=U[id],d=document.createElement("div");d.className="pe";d.id="u-"+id;
    const a=document.createElement("div");a.className="av";a.style.background=col(id);a.textContent=(u.name||"?").slice(0,1);
    if(id===hostUid){const c=document.createElement("i");c.className="cr";c.textContent="👑";a.append(c)}
    const m=document.createElement("i");m.className="mc";m.textContent=u.mic?"🎙":"🔇";a.append(m);
    const n=document.createElement("span");n.textContent=id===uid?"আপনি":(u.name||"");
    d.append(a,n);box.append(d);
  });
}
$("share").onclick=async()=>{const u=location.origin+location.pathname+"?r="+code;try{if(navigator.share)await navigator.share({title:"Watch Party",url:u});else{await navigator.clipboard.writeText(u);toast("লিংক কপি হয়েছে")}}catch(_){}};
$("opn").onclick=()=>set(R("open"),!openCtl);

/* ---------- চ্যাট ও রিঅ্যাকশন ---------- */
function onMsg(m){if(!m)return;if(m.k==="r"){if(now()-m.ts<6000)fl(m);return}add(m)}
function add(m){
  const c=$("chat"),near=c.scrollHeight-c.scrollTop-c.clientHeight<80;
  const w=document.createElement("div");w.className="w"+(m.uid===uid?" me":"");
  const n=document.createElement("div");n.className="nm";n.textContent=m.name;
  const b=document.createElement("div");b.className="b";b.textContent=m.x;
  w.append(n,b);c.append(w);if(near||m.uid===uid)c.scrollTop=1e9;
}
function fl(m){
  const f=document.createElement("div");f.className="fl";f.style.left=(8+Math.random()*80)+"%";
  const s=document.createElement("small");s.textContent=m.name;const b=document.createElement("b");b.textContent=m.x;
  f.append(s,b);$("stage").append(f);setTimeout(()=>f.remove(),2400);
}
function say(){const t=$("mi").value.trim();if(!t)return;$("mi").value="";push(R("chat"),{uid,name,x:t.slice(0,500),k:"m",ts:serverTimestamp()})}
$("sd").onclick=say;$("mi").onkeydown=e=>{if(e.key==="Enter")say()};
["❤️","😂","🔥","👍","😮"].forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>push(R("chat"),{uid,name,x:e,k:"r",ts:serverTimestamp()});$("rx").append(b)});

/* ---------- প্লেয়ার ---------- */
const getT=()=>mode==="yt"?(yt&&yt.getCurrentTime?yt.getCurrentTime():0):V.currentTime;
const playing=()=>mode==="yt"?!!(yt&&yt.getPlayerState&&yt.getPlayerState()===1):!V.paused;
const seek=t=>{if(mode==="yt")yt.seekTo(t,true);else V.currentTime=t};
const play=()=>{if(mode==="yt")yt.playVideo();else V.play().catch(()=>toast("▶ প্লে বাটনে একবার ট্যাপ করুন"))};
const pause=()=>{if(mode==="yt")yt.pauseVideo();else V.pause()};
const quiet=()=>{ignore=true;clearTimeout(quiet.t);quiet.t=setTimeout(()=>ignore=false,1000)};

function local(){if(ignore||!mode)return;if(canCtl())pub({t:getT(),p:playing()});else setTimeout(()=>applyState(S,true),350)}
["play","pause","seeked"].forEach(e=>V.addEventListener(e,local));
function ytState(e){if(e.data===1||e.data===2)local()}
function poll(){
  if(mode!=="yt"||!yt||!yt.getCurrentTime)return;
  const n=Date.now(),c=getT(),ex=lastT+(playing()?(n-lastTs)/1000:0);
  if(Math.abs(c-ex)>1.5)local();lastT=c;lastTs=n;
}
function pub(o){
  const b=S&&S.k?{k:S.k,v:S.v}:{};
  S={...b,...o,at:now(),by:uid};
  set(R("video"),{...b,...o,at:serverTimestamp(),by:uid});
}
async function setSrc(k,v){
  const o={k,v,t:0,p:k!=="file"};
  S={...o,at:now(),by:uid};
  if(await loadSrc(S)){quiet();if(o.p)play()}
  set(R("video"),{...o,at:serverTimestamp(),by:uid});
}
async function applyState(s,force){
  if(!s)return;S=s;const key=s.k+":"+s.v;
  if(s.by===uid&&key===curKey&&!force)return;
  if(key!==curKey){if(!(await loadSrc(s)))return}
  if(!mode)return;
  const ex=s.t+(s.p?(now()-s.at)/1000:0);
  quiet();if(Math.abs(getT()-ex)>1.2)seek(ex);
  if(s.p)play();else pause();
}
async function loadSrc(s){
  curKey=s.k+":"+s.v;$("need").hidden=true;$("empty").hidden=true;
  if(s.k==="yt"){await loadYT(s.v);mode="yt";$("ytw").hidden=false;V.hidden=true;V.pause();return true}
  if(yt&&yt.pauseVideo){try{yt.pauseVideo()}catch(_){}}
  $("ytw").hidden=true;V.hidden=false;mode="v";
  if(s.k==="url"){V.src=s.v;return true}
  if(s.k==="file"){
    if(localFile&&localName===s.v){V.src=localFile;return true}
    $("needt").textContent=s.v;$("need").hidden=false;V.removeAttribute("src");V.load();mode="";return false;
  }
  return false;
}
let yapi;
function yApi(){return yapi||(yapi=new Promise(r=>{window.onYouTubeIframeAPIReady=r;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.append(s)}))}
function loadYT(id){
  return new Promise(async r=>{
    await yApi();
    if(yt&&yt.loadVideoById){yt.loadVideoById(id);r()}
    else yt=new YT.Player("yt",{videoId:id,playerVars:{playsinline:1,rel:0,modestbranding:1},events:{onReady:()=>r(),onStateChange:ytState}});
  });
}
$("go").onclick=()=>{
  const u=$("su").value.trim();if(!u)return;
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  if(m)setSrc("yt",m[1]);else if(/^https?:\/\//i.test(u))setSrc("url",u);else return toast("সঠিক লিংক দিন");
  $("su").value="";
};
$("pf").onclick=$("pk").onclick=()=>$("fi").click();
$("fi").onchange=e=>{
  const f=e.target.files[0];if(!f)return;localFile=URL.createObjectURL(f);localName=f.name;
  if(S&&S.k==="file"&&S.v===f.name){curKey="";applyState(S,true)}
  else if(canCtl())setSrc("file",f.name);
  else toast("এই ফাইল হোস্টের ভিডিওর সাথে মিলছে না");
  e.target.value="";
};

/* ---------- ভয়েস (WebRTC) ---------- */
const sig=(to,type,data)=>push(R("rtc/"+to),{from:uid,type,data:JSON.stringify(data)});
function mkPeer(id){
  const pc=new RTCPeerConnection({iceServers:ICE}),p={pc,q:[],tr:null,audio:null,j:(U[id]||{}).j};peers[id]=p;
  pc.onicecandidate=e=>{if(e.candidate)sig(id,"ice",e.candidate.toJSON())};
  pc.ontrack=e=>{
    p.tr=e.transceiver;try{e.transceiver.direction="sendrecv"}catch(_){}
    const st=e.streams[0]||new MediaStream([e.track]);
    const a=p.audio||(p.audio=new Audio());a.autoplay=true;a.srcObject=st;a.play().catch(()=>{});
    watch(id,st);if(micTrack)e.transceiver.sender.replaceTrack(micTrack);
  };
  pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"&&pc.restartIce)pc.restartIce()};
  return p;
}
async function call(id){
  const p=mkPeer(id);p.tr=p.pc.addTransceiver("audio",{direction:"sendrecv"});
  if(micTrack)p.tr.sender.replaceTrack(micTrack);
  const o=await p.pc.createOffer();await p.pc.setLocalDescription(o);sig(id,"offer",{type:o.type,sdp:o.sdp});
}
function flush(p){p.q.splice(0).forEach(c=>p.pc.addIceCandidate(c).catch(()=>{}))}
async function onSig(m){
  const id=m.from,d=JSON.parse(m.data);
  if(m.type==="offer"){
    if(peers[id])closePeer(id);
    const p=mkPeer(id);await p.pc.setRemoteDescription(d);flush(p);
    const a=await p.pc.createAnswer();await p.pc.setLocalDescription(a);sig(id,"answer",{type:a.type,sdp:a.sdp});
  }else if(m.type==="answer"){const p=peers[id];if(p){await p.pc.setRemoteDescription(d);flush(p)}}
  else if(m.type==="ice"){const p=peers[id];if(!p)return;if(p.pc.remoteDescription)p.pc.addIceCandidate(d).catch(()=>{});else p.q.push(d)}
}
function closePeer(id){const p=peers[id];if(!p)return;try{p.pc.close()}catch(_){}if(p.audio)p.audio.srcObject=null;delete peers[id];delete lv[id]}
function syncPeers(){
  for(const id in U){
    if(id===uid)continue;const p=peers[id];
    if(p&&p.j==null)p.j=U[id].j;
    if(!p||p.j!==U[id].j){if(p)closePeer(id);if(uid>id)call(id).catch(()=>{})}
  }
  for(const id in peers)if(!U[id])closePeer(id);
}
$("mic").onclick=async()=>{
  if(!micTrack){
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      micTrack=s.getAudioTracks()[0];watch(uid,s);
      for(const k in peers){const t=peers[k].tr;if(t)t.sender.replaceTrack(micTrack)}
    }catch(_){return toast("মাইকের অনুমতি দিন")}
  }
  micOn=!micOn;micTrack.enabled=micOn;if(ac&&ac.resume)ac.resume();
  $("mic").classList.toggle("on",micOn);$("mic").textContent=micOn?"🎙 মাইক চালু":"🎙 মাইক বন্ধ";
  update(R("users/"+uid),{mic:micOn});
};
function watch(id,stream){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(stream).connect(an);lv[id]=an}catch(_){}}
function level(){
  const b=new Uint8Array(128);
  for(const id in lv){
    lv[id].getByteFrequencyData(b);let s=0;for(let i=0;i<128;i++)s+=b[i];
    const el=$("u-"+id);if(el)el.classList.toggle("sp",s/128>12&&(id!==uid||micOn));
  }
}
</script></body></html>
